<!doctype html>
<html lang="en">
  <head>

    <title>Stilyagi · Docs — rules catalogue, configuration, colophon</title>

    <style>
      .docs-layout {
        max-width: 1320px;
        margin: 0 auto;
        padding: calc(var(--unit) * 4);
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: calc(var(--unit) * 5);
      }
      .side-toc {
        position: sticky;
        top: 100px;
        align-self: start;
        border-top: var(--rule-weight-2) solid var(--ink);
        padding-top: 14px;
      }
      .side-toc a {
        display: block;
        font-family: var(--font-sans);
        font-size: 0.78rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        padding: 6px 0;
        border-bottom: 1px dashed rgba(15, 15, 15, 0.2);
        text-decoration: none;
      }
      .side-toc a:hover {
        color: var(--press-red);
      }
      .side-toc a.active {
        color: var(--press-red);
        font-weight: 700;
      }

      .cat-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: end;
        margin-bottom: 18px;
        border-bottom: var(--rule-weight-2) solid var(--ink);
        padding-bottom: 14px;
      }
      .cat-head h2 {
        font-family: var(--font-display);
        font-weight: 900;
        text-transform: uppercase;
        font-size: 2.4rem;
        line-height: 0.95;
        margin: 0;
      }
      .cat-head h2 .red {
        color: var(--press-red);
      }
      .cat-head .counts {
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        text-align: right;
        line-height: 1.7;
      }

      .filter-bar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 14px 0 18px;
        border-bottom: var(--rule-weight) solid var(--ink);
        align-items: center;
      }
      .filter-bar .lbl {
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        margin-right: 6px;
      }
      .filter-chip {
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 5px 10px;
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        font-weight: 600;
      }
      .filter-chip.active {
        background: var(--press-red);
        color: var(--paper);
        border-color: var(--press-red);
      }
      .filter-chip.ns-md.active {
        background: var(--signal-sage);
        border-color: var(--signal-sage);
        color: var(--paper);
      }
      .filter-chip.ns-pydoc.active {
        background: var(--rust-patina);
        border-color: var(--rust-patina);
        color: var(--paper);
      }
      .filter-chip.ns-rsdoc.active {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--paper);
      }
      .filter-chip.ns-pun.active {
        background: var(--jazz-magenta);
        border-color: var(--jazz-magenta);
        color: var(--paper);
      }
      .filter-chip.ns-gram.active {
        background: var(--jazz-cyan);
        border-color: var(--jazz-cyan);
        color: var(--ink);
      }
      .filter-chip.ns-spell.active {
        background: var(--jazz-ochre);
        border-color: var(--jazz-ochre);
        color: var(--ink);
      }
      .search-box {
        margin-left: auto;
        min-width: 240px;
        padding: 6px 10px;
        border: 1px solid var(--ink);
        background: var(--paper);
        font-family: var(--font-mono);
        font-size: 0.85rem;
      }
      .search-box:focus {
        outline: 2px solid var(--press-red);
        outline-offset: 1px;
      }

      .rules-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 6px;
      }
      .rules-table th {
        font-family: var(--font-sans);
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
        text-align: left;
        border-bottom: var(--rule-weight-2) solid var(--ink);
        padding: 10px 10px 8px;
      }
      .rules-table td {
        font-family: var(--font-editorial);
        font-size: 1rem;
        line-height: 1.45;
        padding: 12px 10px;
        border-bottom: 1px dashed rgba(15, 15, 15, 0.2);
        vertical-align: top;
      }
      .rules-table tr:hover td {
        background: var(--paper-shade);
      }
      .rules-table .id {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .rules-table .ns {
        display: inline-block;
        padding: 2px 7px 1px;
        font-family: var(--font-sans);
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        font-weight: 700;
        margin-right: 6px;
      }
      .ns-md {
        background: var(--signal-sage);
        color: var(--paper);
      }
      .ns-pydoc {
        background: var(--rust-patina);
        color: var(--paper);
      }
      .ns-rsdoc {
        background: var(--ink);
        color: var(--paper);
      }
      .ns-pun {
        background: var(--jazz-magenta);
        color: var(--paper);
      }
      .ns-gram {
        background: var(--jazz-cyan);
        color: var(--ink);
      }
      .ns-spell {
        background: var(--jazz-ochre);
        color: var(--ink);
      }
      .sev {
        display: inline-block;
        padding: 2px 6px 1px;
        font-family: var(--font-sans);
        font-size: 0.65rem;
        letter-spacing: 0.12em;
        font-weight: 700;
        text-transform: uppercase;
      }
      .sev-err {
        background: var(--press-red);
        color: var(--paper);
      }
      .sev-warn {
        background: var(--jazz-ochre);
        color: var(--ink);
      }
      .sev-info {
        background: var(--paper-shade);
        color: var(--ink);
        border: 1px solid var(--ink);
      }
      .fix {
        font-family: var(--font-sans);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-soft);
        font-weight: 600;
      }
      .fix.safe {
        color: var(--signal-sage);
      }
      .fix.unsafe {
        color: var(--press-red);
      }
      .empty-row td {
        text-align: center;
        padding: 40px;
        color: var(--ink-soft);
        font-style: italic;
      }

      /* Config & suppressions */
      .config-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
        gap: calc(var(--unit) * 4);
        margin-top: calc(var(--unit) * 4);
      }
      .config-grid h3 {
        font-family: var(--font-display);
        font-weight: 900;
        text-transform: uppercase;
        font-size: 1.4rem;
        margin: 0 0 12px;
      }
      .config-grid h3 .red {
        color: var(--press-red);
      }
      .config-grid p {
        font-family: var(--font-editorial);
        font-size: 1.05rem;
        line-height: 1.55;
      }
      .config-grid pre {
        background: var(--ink);
        color: var(--paper);
        padding: 18px 20px;
        font-family: var(--font-mono);
        font-size: 0.82rem;
        line-height: 1.6;
        overflow: auto;
        border-left: 4px solid var(--press-red);
      }
      .config-grid pre .k {
        color: var(--jazz-ochre);
      }
      .config-grid pre .s {
        color: var(--signal-sage);
      }
      .config-grid pre .c {
        color: #9d9d9d;
        font-style: italic;
      }
      .config-grid pre .n {
        color: var(--jazz-cyan);
      }

      .suppress {
        margin-top: calc(var(--unit) * 4);
      }
      .suppress h3 {
        font-family: var(--font-display);
        font-weight: 900;
        text-transform: uppercase;
        font-size: 1.4rem;
        margin: 0 0 14px;
      }
      .suppress .tabs {
        display: flex;
        gap: 0;
        border-bottom: var(--rule-weight-2) solid var(--ink);
        margin-bottom: 14px;
      }
      .suppress .tab {
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 10px 18px;
        cursor: pointer;
        background: transparent;
        border: 0;
        color: var(--ink-soft);
        font-weight: 700;
        border-bottom: 3px solid transparent;
        margin-bottom: -3px;
      }
      .suppress .tab.active {
        color: var(--press-red);
        border-bottom-color: var(--press-red);
        background: var(--paper-shade);
      }
      .suppress pre {
        background: var(--paper-shade);
        color: var(--ink);
        padding: 18px 22px;
        font-family: var(--font-mono);
        font-size: 0.9rem;
        line-height: 1.65;
        border-left: 4px solid var(--ink);
        overflow: auto;
      }
      .suppress pre .com {
        color: var(--press-red);
        font-weight: 700;
      }
      .suppress pre .dim {
        color: var(--ink-soft);
      }

      /* Colophon */
      .colophon-sec {
        background: var(--ink);
        color: var(--paper);
        padding: calc(var(--unit) * 6) 0;
        margin-top: calc(var(--unit) * 6);
        position: relative;
        overflow: hidden;
      }
      .colophon-sec::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: var(--halftone-dot);
        background-size: 9px 9px;
        opacity: 0.08;
      }
      .colophon-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 0 calc(var(--unit) * 4);
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        gap: calc(var(--unit) * 6);
      }
      .colophon-inner h2 {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 3.6rem;
        line-height: 0.9;
        text-transform: uppercase;
        margin: 0 0 18px;
      }
      .colophon-inner h2 .red {
        color: var(--press-red);
      }
      .colophon-inner p {
        font-family: var(--font-editorial);
        font-size: 1.15rem;
        line-height: 1.6;
        max-width: 58ch;
        color: var(--paper);
      }
      .colophon-inner p + p {
        text-indent: 1.8em;
        margin-top: 10px;
      }
      .colophon-inner em {
        font-style: italic;
        color: var(--jazz-ochre);
      }
      .credits {
        border-left: var(--rule-weight-2) solid var(--press-red);
        padding-left: calc(var(--unit) * 3);
      }
      .credits .row {
        padding: 10px 0;
        border-bottom: 1px dashed rgba(248, 243, 230, 0.25);
        font-family: var(--font-sans);
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 10px;
      }
      .credits .row b {
        color: var(--press-red);
        font-weight: 700;
      }
      .credits .row:last-child {
        border-bottom: 0;
      }
      .agitprop-stamp {
        position: absolute;
        right: calc(var(--unit) * 4);
        top: calc(var(--unit) * 2);
        transform: rotate(-4deg);
        border: 3px double var(--press-red);
        color: var(--press-red);
        padding: 6px 14px;
        font-family: var(--font-display);
        font-weight: 900;
        text-transform: uppercase;
        font-size: 0.95rem;
        letter-spacing: 0.1em;
        background: rgba(0, 0, 0, 0.35);
      }

      @media (max-width: 900px) {
        .docs-layout {
          grid-template-columns: 1fr;
        }
        .side-toc {
          position: static;
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
        }
        .side-toc a {
          border: 1px solid var(--ink);
          padding: 6px 10px;
        }
        .config-grid,
        .colophon-inner {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script

      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script type="text/babel" src="assets/Primitives.jsx?v=20260423a"></script>
    <script type="text/babel" src="assets/Chrome.jsx?v=20260423a"></script>

    <script type="text/babel">
      const { useState, useMemo } = React;

      const RULES = [
        // MD
        [
          "MD201",
          "md",
          "Heading depth",
          "Headings must not skip levels (h2 → h4 is rejected).",
          "warn",
          "safe",
        ],
        [
          "MD202",
          "md",
          "ATX heading style",
          "Prefer # over === / --- setext headings.",
          "warn",
          "safe",
        ],
        [
          "MD203",
          "md",
          "Trailing heading punctuation",
          "No trailing punctuation on headings except question marks.",
          "info",
          "safe",
        ],
        [
          "MD210",
          "md",
          "Unordered list marker",
          "Use - consistently across a document.",
          "info",
          "safe",
        ],
        [
          "MD211",
          "md",
          "Ordered list prefix",
          "Order list items sequentially from 1, not all as 1.",
          "warn",
          "safe",
        ],
        [
          "MD220",
          "md",
          "Hard line break",
          "No trailing double-space line breaks; use \\ or a blank line.",
          "info",
          "safe",
        ],
        [
          "MD230",
          "md",
          "Fenced code language",
          "Fenced code blocks must declare a language.",
          "warn",
          "unsafe",
        ],
        [
          "MD231",
          "md",
          "Indented code",
          "Prefer fenced code over indented code.",
          "info",
          "safe",
        ],
        [
          "MD240",
          "md",
          "Autolink bare URL",
          "Wrap bare URLs in <…> or a link.",
          "warn",
          "safe",
        ],
        [
          "MD241",
          "md",
          "Link text empty",
          "Links must have non-empty text.",
          "err",
          "none",
        ],
        [
          "MD250",
          "md",
          "Image alt text",
          "Images must carry alt text.",
          "err",
          "none",
        ],
        [
          "MD260",
          "md",
          "Inline HTML",
          "Inline HTML in Markdown flagged; can be allowlisted.",
          "info",
          "none",
        ],
        // PUN
        [
          "PUN101",
          "pun",
          "Double space after period",
          "Collapse double spaces after terminal punctuation.",
          "info",
          "safe",
        ],
        [
          "PUN201",
          "pun",
          "Smart quotes",
          "Curly quotes preferred over ASCII quotes in prose regions.",
          "warn",
          "safe",
        ],
        [
          "PUN202",
          "pun",
          "Em-dash spacing",
          "Em-dashes must not be surrounded by spaces (house style).",
          "info",
          "safe",
        ],
        [
          "PUN203",
          "pun",
          "Oxford comma",
          "Final comma before the conjunction in a list of three or more.",
          "warn",
          "safe",
        ],
        [
          "PUN204",
          "pun",
          "Ellipsis",
          "Use the ellipsis character, not three periods.",
          "info",
          "safe",
        ],
        // PYDOC
        [
          "PYDOC101",
          "pydoc",
          "Missing docstring",
          "Public modules, classes, and functions require a docstring.",
          "warn",
          "none",
        ],
        [
          "PYDOC102",
          "pydoc",
          "Summary line",
          "First docstring line must be a complete imperative sentence.",
          "warn",
          "unsafe",
        ],
        [
          "PYDOC103",
          "pydoc",
          "Summary length",
          "Summary line must be 80 characters or fewer.",
          "info",
          "none",
        ],
        [
          "PYDOC110",
          "pydoc",
          "Imperative mood",
          'Summary should read "Compute…" not "Computes…".',
          "info",
          "unsafe",
        ],
        [
          "PYDOC120",
          "pydoc",
          "Args alignment",
          "Every declared parameter must be documented; no phantoms.",
          "err",
          "none",
        ],
        [
          "PYDOC121",
          "pydoc",
          "Returns documented",
          "Functions with a return value require a Returns section.",
          "warn",
          "none",
        ],
        [
          "PYDOC130",
          "pydoc",
          "Raises cited",
          "Documented exceptions must match actual raise statements.",
          "warn",
          "none",
        ],
        // RSDOC
        [
          "RSDOC101",
          "rsdoc",
          "Crate root docstring",
          "Every crate root must carry a //! documentation comment.",
          "warn",
          "none",
        ],
        [
          "RSDOC110",
          "rsdoc",
          "Public item doc",
          "Public items require /// documentation.",
          "warn",
          "none",
        ],
        [
          "RSDOC120",
          "rsdoc",
          "Code example",
          "Public API examples should compile under rustdoc.",
          "info",
          "none",
        ],
        [
          "RSDOC130",
          "rsdoc",
          "Intra-doc links",
          "Prefer intra-doc links over bare paths.",
          "info",
          "safe",
        ],
        // GRAM
        [
          "GRAM201",
          "gram",
          "Passive voice",
          "Flag passive-voice sentences in prose regions.",
          "info",
          "none",
        ],
        [
          "GRAM210",
          "gram",
          "Sentence length",
          "Flag sentences beyond the configured word ceiling.",
          "info",
          "none",
        ],
        [
          "GRAM220",
          "gram",
          "Weasel words",
          '"Very", "quite", "rather" — flagged, not forbidden.',
          "info",
          "none",
        ],
        // SPELL
        [
          "SPELL101",
          "spell",
          "Unknown word",
          "Words absent from dictionary and allowlist.",
          "info",
          "none",
        ],
        [
          "SPELL110",
          "spell",
          "Commonly misspelled",
          "High-confidence corrections for common misspellings.",
          "warn",
          "safe",
        ],
        [
          "SPELL120",
          "spell",
          "Terminology consistency",
          "Enforce canonical spellings for project terms.",
          "warn",
          "safe",
        ],
      ];

      const NS = [
        ["all", "All", null],
        ["md", "Markdown", "ns-md"],
        ["pydoc", "PyDoc", "ns-pydoc"],
        ["rsdoc", "RsDoc", "ns-rsdoc"],
        ["pun", "Punctuation", "ns-pun"],
        ["gram", "Grammar", "ns-gram"],
        ["spell", "Spell", "ns-spell"],
      ];

      function RulesCatalogue() {
        const [ns, setNs] = useState("all");
        const [q, setQ] = useState("");
        const filtered = useMemo(
          () =>
            RULES.filter((r) => {
              if (ns !== "all" && r[1] !== ns) return false;
              if (!q) return true;
              const hay = (r[0] + " " + r[2] + " " + r[3]).toLowerCase();
              return hay.includes(q.toLowerCase());
            }),
          [ns, q],
        );

        const counts = NS.slice(1).map(
          ([slug]) => RULES.filter((r) => r[1] === slug).length,
        );

        return (
          <section id="catalogue" style={{ scrollMarginTop: 90 }}>
            <div className="cat-head">
              <h2>
                The <span className="red">rules</span> catalogue
              </h2>
              <div className="counts">
                {RULES.length} rules · 6 namespaces
                <br />
                {counts.map((c, i) => (
                  <span key={i}>
                    {NS[i + 1][1]} {c}&nbsp;&nbsp;
                  </span>
                ))}
              </div>
            </div>

            <div className="filter-bar">
              <span className="lbl">Filter</span>
              {NS.map(([slug, label, cls]) => (
                <button
                  key={slug}
                  className={`filter-chip ${ns === slug ? "active" : ""} ${ns === slug && cls ? cls : ""}`}
                  onClick={() => setNs(slug)}
                >
                  {label}
                </button>
              ))}
              <input
                className="search-box"
                placeholder="search rule name or id…"
                value={q}
                onChange={(e) => setQ(e.target.value)}
              />
            </div>

            <table className="rules-table">
              <thead>
                <tr>
                  <th style={{ width: 110 }}>Rule</th>
                  <th>Title &amp; description</th>
                  <th style={{ width: 100 }}>Severity</th>
                  <th style={{ width: 90 }}>Autofix</th>
                </tr>
              </thead>
              <tbody>
                {filtered.length === 0 ? (
                  <tr className="empty-row">
                    <td colSpan={4}>No rules match that filter.</td>
                  </tr>
                ) : (
                  filtered.map(([id, nsSlug, title, desc, sev, fix]) => (
                    <tr key={id}>
                      <td className="id">
                        <span className={`ns ns-${nsSlug}`}>
                          {nsSlug.toUpperCase()}
                        </span>
                        <br />
                        {id}
                      </td>
                      <td>
                        <b>{title}</b>
                        <br />
                        <span style={{ color: "var(--ink-soft)" }}>{desc}</span>
                      </td>
                      <td>
                        <span className={`sev sev-${sev}`}>
                          {sev === "err"
                            ? "Error"
                            : sev === "warn"
                              ? "Warning"
                              : "Info"}
                        </span>
                      </td>
                      <td>
                        <span className={`fix ${fix}`}>
                          {fix === "none" ? "—" : fix}
                        </span>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
          </section>
        );
      }

      function Configuration() {
        return (
          <section id="config" style={{ marginTop: 80, scrollMarginTop: 90 }}>
            <div className="cat-head">
              <h2>
                <span className="red">Configuration</span> · one file, no
                ceremony
              </h2>
              <div className="counts">
                stilyagi.toml
                <br />
                pyproject.toml [tool.stilyagi]
              </div>
            </div>

            <div className="config-grid">
              <div>
                <h3>
                  The <span className="red">select</span> / ignore model
                </h3>
                <p>
                  Stilyagi borrows its configuration vocabulary from Ruff. You{" "}
                  <em>select</em> rule codes or namespaces to enable; you{" "}
                  <em>ignore</em> specific codes to silence. Namespaces are the
                  uppercase prefix — <code>MD</code>, <code>PUN</code>,{" "}
                  <code>PYDOC</code> — and match by prefix, not by regex.
                </p>
                <p>
                  Per-rule options live under <code>[rule.XXX]</code>. A rule
                  that accepts options (like <code>PUN201</code>, smart quotes)
                  documents its schema in its own description; invalid keys fail
                  the run rather than being silently ignored.
                </p>
              </div>
              <pre>
                <code>
                  <span className="c"># stilyagi.toml</span>
                  <span className="k">line-length</span> ={" "}
                  <span className="n">100</span>
                  <span className="k">select</span> = [
                  <span className="s">"MD"</span>,{" "}
                  <span className="s">"PUN"</span>,{" "}
                  <span className="s">"PYDOC"</span>]
                  <span className="k">ignore</span> = [
                  <span className="s">"MD260"</span>,{" "}
                  <span className="s">"PUN204"</span>]
                  <span className="c"># Per-rule configuration</span>[
                  <span className="k">rule.PUN201</span>]
                  <span className="k">style</span> ={" "}
                  <span className="s">"british"</span>
                  <span className="k">allow-straight</span> = [
                  <span className="s">"code"</span>,{" "}
                  <span className="s">"inline_code"</span>] [
                  <span className="k">rule.GRAM210</span>]
                  <span className="k">max-words</span> ={" "}
                  <span className="n">32</span>
                  <span className="c"># Per-file overrides — glob-matched</span>
                  [<span className="k">per-file</span>]
                  <span className="s">"docs/reference/**"</span> = {"{"}{" "}
                  <span className="k">extend-select</span> = [
                  <span className="s">"GRAM"</span>] {"}"}
                  <span className="s">"**/CHANGELOG.md"</span> = {"{"}{" "}
                  <span className="k">ignore</span> = [
                  <span className="s">"MD201"</span>] {"}"}
                </code>
              </pre>
            </div>
          </section>
        );
      }

      function Suppressions() {
        const [tab, setTab] = useState("md");
        return (
          <section
            id="suppress"
            className="suppress"
            style={{ marginTop: 80, scrollMarginTop: 90 }}
          >
            <div className="cat-head">
              <h2>
                <span className="red">Suppressions</span> · three scopes, no
                magic
              </h2>
              <div className="counts">line · next-line · block</div>
            </div>

            <div className="tabs">
              <button
                className={`tab ${tab === "md" ? "active" : ""}`}
                onClick={() => setTab("md")}
              >
                Markdown
              </button>
              <button
                className={`tab ${tab === "py" ? "active" : ""}`}
                onClick={() => setTab("py")}
              >
                Python docstring
              </button>
            </div>

            {tab === "md" ? (
              <pre>
                <span className="com">
                  &lt;!-- stilyagi: disable-next-line PUN201 --&gt;
                </span>
                She said "no" — a single word, straight-quoted on purpose. This
                paragraph opts out of the sentence-length check for dramatic
                effect.
                <span className="com">
                  &lt;!-- stilyagi: disable-block GRAM210 --&gt;
                </span>
                It was the best of times, it was the worst of times, it was the
                age of wisdom, it was the age of foolishness, it was the epoch
                of belief, it was the epoch of incredulity, it was the season of
                light, it was the season of darkness, it was the spring of hope,
                it was the winter of despair.
                <span className="com">
                  &lt;!-- stilyagi: enable-block GRAM210 --&gt;
                </span>
                Ordinary prose resumes here.{" "}
                <span className="com">
                  &lt;!-- stilyagi: disable-line PUN101 --&gt;
                </span>
                <span className="dim">
                  # ^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^ # disables only the
                  preceding line
                </span>
              </pre>
            ) : (
              <pre>
                <span className="com">def</span>{" "}
                <span className="com">compute_metrics</span>(series, window=7):
                <span className="dim">"""</span>
                <span className="dim">
                  {" "}
                  Compute rolling metrics across the given series.
                </span>
                <span className="dim">
                  {" "}
                  The smoothing window is in trading days, not calendar days.
                </span>
                <span className="dim"> Args:</span>
                <span className="dim"> series: price series, normalized.</span>
                <span className="dim">
                  {" "}
                  window: lookback in trading days (default: 7).
                </span>
                <span className="com"> # stilyagi: disable-line PYDOC103</span>
                <span className="dim">
                  {" "}
                  _internal_debug_flag: unused; retained for historical
                  instrumentation and compatibility.
                </span>
                <span className="dim"> """</span>
                ...
              </pre>
            )}

            <p
              style={{
                fontFamily: "var(--font-editorial)",
                fontSize: "1rem",
                color: "var(--ink-soft)",
                marginTop: 14,
                maxWidth: "72ch",
              }}
            >
              Suppressions live in the source, not in the config. They travel
              with the prose they protect. A suppression must name its rule —
              wildcards are refused — so a reader can always answer the
              question: <em>why is this line exempt?</em>
            </p>
          </section>
        );
      }

      function Colophon() {
        return (
          <section
            id="colophon"
            className="colophon-sec"
            style={{ scrollMarginTop: 90 }}
          >
            <div className="agitprop-stamp">An agitprop object</div>
            <div className="colophon-inner">
              <div>
                <h2>
                  A <span className="red">colophon</span>,<br />
                  of sorts.
                </h2>
                <p>
                  Stilyagi is, first, a working prose linter. It is also,
                  deliberately, an <em>agitprop object</em> — a statement about
                  what documentation tooling <em>could</em> be if we stopped
                  treating prose as a second-class artefact of software.
                </p>
                <p>
                  Rust does the boring, bytes-level work: opening files, finding
                  the regions that contain prose, emitting an intermediate
                  representation with stable line indices and content hashes.
                  Python does the interesting work: writing down the rules of a
                  house style, one rule at a time, in a language the people who
                  care about prose can read.
                </p>
                <p>
                  The capability planner is the hinge. It keeps the fast path
                  fast and permits the slow path to exist. Without it, grammar
                  and spellcheck could not join the catalogue; with it, they are
                  merely entries in a toml file, loaded on demand, uninvolved
                  when unwanted.
                </p>
                <p>
                  The name is deliberate. <em>Stilyagi</em>, like the people it
                  takes its name from, believes that style is a political act —
                  and that doing style well, in the grain of a rigorous system,
                  is the point.
                </p>
              </div>
              <div className="credits">
                <div className="row">
                  <b>Kind</b>
                  <span>Prose linter, dual-runtime</span>
                </div>
                <div className="row">
                  <b>Extractor</b>
                  <span>
                    Rust · PyO3 · pulldown-cmark · syn · rustpython-parser
                  </span>
                </div>
                <div className="row">
                  <b>Runtime</b>
                  <span>Python 3.11+ · typer · pluggy</span>
                </div>
                <div className="row">
                  <b>Optional</b>
                  <span>spaCy · symspellpy</span>
                </div>
                <div className="row">
                  <b>Output</b>
                  <span>text · json · sarif v2.1.0</span>
                </div>
                <div className="row">
                  <b>License</b>
                  <span>Apache-2.0</span>
                </div>
                <div className="row">
                  <b>Status</b>
                  <span style={{ color: "var(--press-red)", fontWeight: 700 }}>
                    Draft · v0.4.0 in flight
                  </span>
                </div>
                <div className="row">
                  <b>Set in</b>
                  <span>
                    Big Shoulders · EB Garamond · IBM Plex Sans · JetBrains Mono
                  </span>
                </div>
                <div className="row">
                  <b>Spelling</b>
                  <span>Oxford</span>
                </div>
                <div className="row">
                  <b>Made in</b>
                  <span>Edinburgh, under a red pencil</span>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function Docs() {
        const [active, setActive] = useState("catalogue");
        React.useEffect(() => {
          const ids = ["catalogue", "config", "suppress", "colophon"];
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) setActive(e.target.id);
              });
            },
            { rootMargin: "-40% 0px -55% 0px" },
          );
          ids.forEach((id) => {
            const el = document.getElementById(id);
            if (el) io.observe(el);
          });
          return () => io.disconnect();
        }, []);

        return (
          <React.Fragment>
            <Nav active="docs" />

            <PageHero
              eyebrow="§ Documentation · operating surface"
              title={
                <>
                  The <span className="red">rules</span>, the config, the seal.
                </>
              }
              lede="Every Stilyagi rule has an ID, a namespace, a severity, and a fix class — knowable at a glance. Configuration is a single TOML file. Suppressions live in the source. This page lays the whole operating surface out in one place."
              stamp="v0.4"
            />

            <div className="docs-layout">
              <aside className="side-toc">
                <a
                  href="#catalogue"
                  className={active === "catalogue" ? "active" : ""}
                >
                  § I. Rules
                </a>
                <a
                  href="#config"
                  className={active === "config" ? "active" : ""}
                >
                  § II. Config
                </a>
                <a
                  href="#suppress"
                  className={active === "suppress" ? "active" : ""}
                >
                  § III. Suppressions
                </a>
                <a
                  href="#colophon"
                  className={active === "colophon" ? "active" : ""}
                >
                  § IV. Colophon
                </a>
              </aside>
              <div>
                <RulesCatalogue />
                <Configuration />
                <Suppressions />
              </div>
            </div>

            <Colophon />
            <Footer active="docs" />
          </React.Fragment>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<Docs />);
    </script>
  </body>
</html>
