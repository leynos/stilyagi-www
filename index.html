        margin: 0 auto;
        padding: calc(var(--unit) * 3) calc(var(--unit) * 4)
          calc(var(--unit) * 8);
      }

      .poster-board {
        position: relative;
        border: var(--rule-weight-2) solid var(--ink);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.28),
            rgba(255, 255, 255, 0)
          ),
          var(--paper);
        padding: calc(var(--unit) * 2);
        box-shadow: inset 0 0 0 1px rgba(15, 15, 15, 0.12);
      }

      .poster-board::before,
      .poster-board::after {
        content: "";
        position: absolute;
        width: 110px;
        height: 18px;
        background: repeating-linear-gradient(
          135deg,
          var(--ink) 0 10px,
          var(--press-red) 10px 20px
        );
      }

      .poster-board::before {
        top: -2px;
        right: 34px;
      }
      .poster-board::after {
        bottom: -2px;
        left: 34px;
      }

      .poster-showcase {
        position: relative;
        overflow: hidden;
        border: var(--rule-weight) solid var(--ink);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent),
          var(--paper);
        padding: 20px 24px 24px;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 18px;
      }

      .poster-showcase::before {
        display: none;
      }

      .poster-art-frame {
        position: relative;
        isolation: isolate;
        border: var(--rule-weight-2) solid var(--ink);
        background: var(--paper);
        padding: 0;
        overflow: hidden;
      }

      .poster-art-frame img {
        position: relative;
        z-index: 0;
        width: 100%;
        display: block;
        object-fit: cover;
        aspect-ratio: 1672 / 941;
      }

      .poster-hero-copy {
        position: absolute;
        left: clamp(18px, 3vw, 36px);
        top: clamp(16px, 2vw, 24px);
        z-index: 2;
        display: flex;
        justify-content: space-between;
        gap: 12px 20px;
        width: calc(100% - clamp(36px, 6vw, 72px));
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
        pointer-events: none;
      }

      .poster-hero-copy .accent {
        color: var(--press-red);
        font-weight: 700;
      }

      .poster-title {
        position: absolute;
        left: clamp(26px, 4vw, 72px);
        top: clamp(34px, 5vw, 76px);
        z-index: 2;
        margin: 0;
        font-family: var(--font-display);
        font-size: clamp(5rem, 9vw, 7rem);
        line-height: 0.83;
        max-width: 4.8ch;
        pointer-events: none;
      }

      .poster-title .red {
        color: var(--press-red);
      }

      .poster-annotation {
        position: absolute;
        top: 36px;
        right: 295px;
        z-index: 2;
        width: 8em;
        text-align: center;
        transform: rotate(4deg);
        font-family: var(--font-mono);
        font-size: 12px;
        line-height: 1.6;
        color: var(--ink);
        pointer-events: none;
      }

      .stamp-pocket {
        display: none;
      }

      .poster-tiles {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }

      .poster-tile {
        border: var(--rule-weight) solid var(--ink);
        padding: 18px 10px;
        text-align: center;
        font-family: var(--font-sans);
        font-size: 0.74rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 700;
        background: var(--paper);
      }

      .poster-tile.red {
        background: rgba(194, 39, 46, 0.14);
      }
      .poster-tile.cyan {
        background: rgba(41, 180, 196, 0.16);
      }
      .poster-tile.ochre {
        background: rgba(214, 159, 46, 0.18);
      }
      .poster-tile.magenta {
        background: rgba(216, 30, 121, 0.16);
      }

      .section-flag {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 18px;
        align-items: center;
        margin: calc(var(--unit) * 7) 0 calc(var(--unit) * 4);
      }

      .section-flag::before,
      .section-flag::after {
        content: "";
        height: 2px;
        background: var(--ink);
      }

      .section-flag h2 {
        margin: 0;
        font-size: clamp(2.4rem, 3vw, 4rem);
        text-align: center;
      }

      .section-flag h2 .red {
        color: var(--press-red);
      }

      .explore-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: calc(var(--unit) * 3);
      }

      .tool-card {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 14px;
        min-height: 320px;
        padding: calc(var(--unit) * 2);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.22),
            rgba(255, 255, 255, 0)
          ),
          var(--paper);
        border: var(--rule-weight) solid var(--ink);
        position: relative;
      }

      .tool-card::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        height: 4px;
        background: var(--accent-color, var(--press-red));
      }

        font-family: var(--font-sans);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent-color, var(--press-red));
      }

      .tool-art {
        min-height: 108px;
        aspect-ratio: 1672 / 941;
        border: var(--rule-weight) solid var(--ink);
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.18),
            rgba(255, 255, 255, 0)

          var(--paper-shade);
        overflow: hidden;
        display: grid;
        place-items: center;
      }

      .tool-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tool-emblem {
        width: 100%;
        height: 100%;
        display: grid;
        align-content: center;
        gap: 8px;
        padding: 14px;
        text-align: center;
      }

      .tool-emblem .big {
        font-family: var(--font-display);
        font-size: 2.05rem;
        line-height: 0.88;
      }

      .tool-emblem .small {
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .tool-emblem .rule {
        height: 2px;
        background: var(--ink);
      }

      .tool-card h3 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 2rem;
        line-height: 0.9;
      }

      .tool-card p {
        margin: 0;
        font-family: var(--font-editorial);
        line-height: 1.45;
      }

      .tool-card a {
        font-family: var(--font-sans);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--accent-color, var(--press-red));
      }

      .tool-card a:hover {
        color: var(--ink);
      }

        margin-top: calc(var(--unit) * 7);
        background: var(--paper-shade);
        border-top: var(--rule-weight-2) solid var(--ink);
        border-bottom: var(--rule-weight-2) solid var(--ink);
      }

      .value-grid {
        max-width: 1320px;
        margin: 0 auto;
        padding: calc(var(--unit) * 4);
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .value-card {
        padding: calc(var(--unit) * 4);
        border-right: var(--rule-weight) solid var(--ink);
      }

      .value-card:last-child {
        border-right: 0;
      }

      .value-card .eyebrow {
        font-family: var(--font-sans);
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--press-red);
      }

      .value-card h3 {
        margin: 12px 0 10px;
        font-family: var(--font-display);
        font-size: 2rem;
        line-height: 0.9;
      }

      .value-card p {
        margin: 0;
        font-family: var(--font-editorial);
        line-height: 1.5;
      }

      .pipeline-poster {
        margin-top: calc(var(--unit) * 7);
      }

      .pipeline-frame {
        border: var(--rule-weight-2) solid var(--ink);
        background: var(--paper);
        padding: calc(var(--unit) * 2);
      }

      .pipeline-frame img {
        width: 100%;
        border: var(--rule-weight) solid var(--ink);
        display: block;
      }

      .pipeline-caption {
        margin-top: 10px;
        font-family: var(--font-sans);
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .command-rail {
        margin-top: calc(var(--unit) * 7);
        border: var(--rule-weight-2) solid var(--ink);
        background:
          linear-gradient(90deg, rgba(15, 15, 15, 0.06), transparent 28%),
          var(--paper);
        padding: calc(var(--unit) * 4);
        display: grid;
        grid-template-columns: minmax(220px, 0.9fr) minmax(0, 1.1fr);
        gap: calc(var(--unit) * 4);
        align-items: center;
      }

      .command-label {
        font-family: var(--font-display);
        font-size: clamp(2.6rem, 4vw, 4.5rem);
        line-height: 0.86;
      }

      .command-label .red {
        color: var(--press-red);
      }

      .command-steps {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: calc(var(--unit) * 2);
      }

      .command-step {
        border: var(--rule-weight) solid var(--ink);
        background: rgba(255, 255, 255, 0.36);
        padding: calc(var(--unit) * 2);
      }

      .command-step code {
        display: block;
        margin-bottom: 10px;
        font-family: var(--font-mono);
        font-size: 0.95rem;
        color: var(--press-red);
      }

      .command-step p {
        margin: 0;
        font-family: var(--font-editorial);
        line-height: 1.45;
      }

      .reading-grid {
        margin-top: calc(var(--unit) * 7);
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: calc(var(--unit) * 3);
      }

      .reading-room {
        display: grid;
        gap: 12px;
        padding: calc(var(--unit) * 2);
        border: var(--rule-weight) solid var(--ink);
        background: var(--paper);
      }

      .reading-room .eyebrow {
        font-family: var(--font-sans);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--press-red);
      }

      .reading-room h3 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 2rem;
        line-height: 0.9;
      }

      .reading-room p {
        margin: 0;
        font-family: var(--font-editorial);
        line-height: 1.45;
      }

      .reading-room a {
        font-family: var(--font-sans);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink);
      }

      .reading-room a:hover {
        color: var(--press-red);
      }

      @media (max-width: 1180px) {
        .explore-grid,
        .reading-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 980px) {
        .command-rail {
          grid-template-columns: 1fr;
        }

        .value-grid {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .value-card {
          border-right: 0;
          border-bottom: var(--rule-weight) solid var(--ink);
        }

        .value-card:last-child {
          border-bottom: 0;
        }
      }

      @media (max-width: 720px) {
        .home-shell {
          padding-inline: calc(var(--unit) * 2);
        }

        .poster-showcase {
          padding: 14px;
        }

        .poster-art-frame img {
          aspect-ratio: 4 / 5;
          object-position: 60% center;
        }

        .poster-title {
          left: 16px;
          top: 48px;
          max-width: 3.8ch;
          font-size: clamp(3rem, 14vw, 4.8rem);
        }

        .poster-annotation {
          top: 16px;
          right: 22px;
          width: 7em;
          font-size: 0.62rem;
          line-height: 1.45;
        }

        .poster-hero-copy {
          left: 18px;
          top: 12px;
          width: calc(100% - 36px);
          font-size: 0.62rem;
          gap: 10px;
        }

        .poster-tiles {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .poster-tile {
          padding: 14px 8px;
          font-size: 0.68rem;
        }

        .command-steps,
        .explore-grid,
        .reading-grid {
          grid-template-columns: 1fr;
        }

        .section-flag {
          grid-template-columns: 1fr;
        }

        .section-flag::before,
        .section-flag::after {
          display: none;
        }
      }
    </style>
  </head>

                </p>
              </article>
            </div>
          </section>
        );
      }

      function PipelinePoster() {
        return (
          <section className="pipeline-poster">
            <div className="section-flag">
              <h2>
                The pipeline, <span className="red">as printed</span>
              </h2>
            </div>
            <div className="pipeline-frame">
              <img
                src="assets/stilyagi-presentation-reduced/stilyagi-026.jpg"
                alt="Poster showing the Stilyagi pipeline from Rust parsing through IR schema to Python rules and final diagnostics"
              />
            </div>
            <div className="pipeline-caption">
              Figure 01 · Presentation board from the Stilyagi deck, reused here
              as the canonical overview of the processing chain.
            </div>
          </section>
        );
      }

      function CommandRail() {
        return (
          <section className="command-rail" aria-labelledby="three-commands">
            <div className="command-label" id="three-commands">
              Start in <span className="red">three commands</span>
            </div>
            <div className="command-steps">
              <article className="command-step">
                <code>$ stilyagi check</code>
                <p>
                  Run analysis and print diagnostics with source-backed spans
                  and stable ordering.
                </p>
              </article>
              <article className="command-step">
                <code>$ stilyagi dump-ir</code>
                <p>
                  Inspect the intermediate representation so rules can reason
                  about the same contract the extractor emitted.
                </p>
              </article>
              <article className="command-step">
                <code>$ stilyagi clean</code>
                <p>
                  Remove caches and temporary artefacts when you want a fresh
                  run or a tidier working tree.
                </p>
              </article>
            </div>
          </section>
        );
      }

      function ReadingRooms() {
        return (
          <section>
            <div className="section-flag">
              <h2>
                Choose your <span className="red">briefing room</span>
              </h2>
            </div>
            <div className="reading-grid">
              {readingRooms.map((room) => (
                <article className="reading-room" key={room.title}>
                  <div className="eyebrow">{room.eyebrow}</div>
                  <h3>{room.title}</h3>
                  <p>{room.description}</p>
                  <a href={room.href}>{room.cta}</a>
                </article>
              ))}
            </div>
          </section>
        );
      }

      function App() {
        return (
          <>
            <SiteMast current="home" />
            <main className="home-shell">
              <HeroPoster />
              <ExploreGrid />
              <ValueBand />
              <PipelinePoster />
              <CommandRail />
              <ReadingRooms />
            </main>
            <Colophon />
            <TweaksDock />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
