        letter-spacing: 0.18em;

        margin: 0;

        line-height: 0.9;

          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 980px) {
        .poster-grid,
        .command-rail {
          grid-template-columns: 1fr;
        }

        .poster-copy,
        .poster-art {
          min-height: auto;
        }

        .value-grid {
          grid-template-columns: 1fr;
          gap: 0;
        }

        .value-card {
          border-right: 0;
          border-bottom: var(--rule-weight) solid var(--ink);
        }

          border-bottom: 0;
        }

          padding-inline: calc(var(--unit) * 2);

          font-size: clamp(4rem, 16vw, 6.2rem);
        }

        .poster-copy,
        .poster-art {
          padding: calc(var(--unit) * 3);
        }

        .poster-tiles,
        .command-steps,
        .explore-grid,
        .reading-grid {
          grid-template-columns: 1fr;
        }

        .section-flag {
          grid-template-columns: 1fr;
        }

        .section-flag::before,
        .section-flag::after {
          display: none;
        }
      }
    </style>

      ];

      function ToolVisual({ art, title }) {
        if (art.type === "image") {
          return (
            <div className="tool-art">
              <img src={art.src} alt={art.alt} />
            </div>
          );
        }

        return (
          <div className="tool-art">
            <div className="tool-emblem" aria-hidden="true">
              <div className="big">{art.lines[0]}</div>
              <div className="rule" />
              <div className="small">{art.lines.slice(1).join(" · ")}</div>
              <div className="small" style={{ color: "var(--press-red)" }}>
                {art.note}
              </div>
            </div>
          </div>
        );
      }

      function HeroPoster() {
        const [stamp, setStamp] = useState(
          window.__stilyagiTweaks?.stamp || "Draft",
        );

        useEffect(() => {
          const handleTweaks = (event) =>
            setStamp(event.detail.stamp || "Draft");
          window.addEventListener("stilyagi:tweaks", handleTweaks);
          return () =>
            window.removeEventListener("stilyagi:tweaks", handleTweaks);
        }, []);

        return (
          <section className="poster-board" aria-labelledby="home-title">
            <div className="poster-grid">
              <div className="poster-copy">
                <div>
                  <div className="poster-kicker">
                    <span>Overview</span>
                    <span className="accent">Edition № 001</span>
                    <span>Rust + Python static analysis</span>
                  </div>
                  <h1 id="home-title" className="poster-title">
                    A Compiler
                    <br />
                    for <span className="red">Prose</span>
                  </h1>
                  <p className="poster-dek">
                    Deterministic documentation linting with{" "}
                    <span className="red">absolute source fidelity</span>.
                  </p>
                  <p className="poster-lede">
                    Stilyagi parses repository text, applies typed policies, and
                    reports precise findings down to exact byte segments.
                  </p>
                  <div className="poster-actions">
                    <a className="btn red" href="docs.html">
                      Get Started
                    </a>
                    <a className="btn ghost" href="design.html">
                      View Architecture
                    </a>
                  </div>
                </div>

                <div>
                  <div className="cli-ribbon">
                    <div className="cli-pointer" aria-hidden="true">
                      ☞
                    </div>
                    <div className="cli-card">
                      <span className="prompt">$</span> stilyagi check
                    </div>
                  </div>
                  <div className="poster-note">
                    Parse · analyse · diagnose · fix
                  </div>
                </div>
              </div>

              <div className="poster-art">
                <div className="poster-art-header">
                  <div className="eyebrow">Press Room · Poster Plate</div>
                  <h2>Industrial parsing meets jazz-age rulecraft.</h2>
                  <p>
                    The visual language stays bold, printed, and slightly unruly
                    while the analysis stays deterministic.
                  </p>
                </div>

                <div className="poster-art-frame">
                  <img
                    src="assets/images/hero-collage-generated.png"
                    alt="Poster collage of a typewriter, gears, and a saxophonist beside a conveyor of analysis tiles"
                  />
                  <div className="stamp-pocket">
                    <Stamp>{stamp}</Stamp>
                  </div>
                </div>

                <div className="poster-tiles" aria-hidden="true">
                  <div className="poster-tile red">Parse</div>
                  <div className="poster-tile cyan">Analyse</div>
                  <div className="poster-tile ochre">Diagnose</div>
                  <div className="poster-tile magenta">Fix</div>
                </div>
              </div>
            </div>
          </section>
        );
      }

      function ExploreGrid() {
        return (
          <section>
            <div className="section-flag">
              <h2>
                Explore the <span className="red">tool</span>
              </h2>
            </div>
            <div className="explore-grid">
              {toolCards.map((card) => (
                <article
                  className="tool-card"
                  key={card.title}
                  style={{ "--accent-color": card.accent }}
                >
                  <div className="eyebrow">{card.eyebrow}</div>
                  <ToolVisual art={card.art} title={card.title} />
                  <div>
                    <h3>{card.title}</h3>
                    <p>{card.description}</p>
                  </div>
                  <a href={card.href}>{card.cta}</a>
                </article>
              ))}
            </div>
          </section>
        );
      }

      function ValueBand() {
        return (
          <section className="value-band" aria-labelledby="why-stilyagi">
            <div className="value-grid">
              <article className="value-card">
                <div className="eyebrow">Why Stilyagi</div>
                <h3 id="why-stilyagi">Absolute Source Fidelity</h3>
                <p>
                  Findings map to exact byte spans. No lossy transforms, no
                  invented context, no flattened approximation.
                </p>
              </article>
              <article className="value-card">
                <div className="eyebrow">Policy</div>
                <h3>Programmable Policy</h3>
                <p>
                  Typed Python rules over a rich IR let teams encode house
                  style, compliance, and taste without falling back to regex
                  folklore.
                </p>
              </article>
              <article className="value-card">
                <div className="eyebrow">Planning</div>
                <h3>Capability-Planned Analysis</h3>
                <p>
                  Run only the analysis you need. Fast by default, deeper when
                  requested, always explicit about the cost.
                </p>
              </article>
            </div>
          </section>
        );
      }

      function PipelinePoster() {
        return (
          <section className="pipeline-poster">
            <div className="section-flag">
              <h2>
                The pipeline, <span className="red">as printed</span>
              </h2>
            </div>
            <div className="pipeline-frame">
              <img
                src="assets/stilyagi-presentation-reduced/stilyagi-026.jpg"
                alt="Poster showing the Stilyagi pipeline from Rust parsing through IR schema to Python rules and final diagnostics"
              />
            </div>
            <div className="pipeline-caption">
              Figure 01 · Presentation board from the Stilyagi deck, reused here
              as the canonical overview of the processing chain.
            </div>
          </section>
        );
      }

      function CommandRail() {
        return (
          <section className="command-rail" aria-labelledby="three-commands">
            <div className="command-label" id="three-commands">
              Start in <span className="red">three commands</span>
            </div>
            <div className="command-steps">
              <article className="command-step">
                <code>$ stilyagi check</code>
                <p>
                  Run analysis and print diagnostics with source-backed spans
                  and stable ordering.
                </p>
              </article>
              <article className="command-step">
                <code>$ stilyagi dump-ir</code>
                <p>
                  Inspect the intermediate representation so rules can reason
                  about the same contract the extractor emitted.
                </p>
              </article>
              <article className="command-step">
                <code>$ stilyagi clean</code>
                <p>
                  Remove caches and temporary artefacts when you want a fresh
                  run or a tidier working tree.
                </p>
              </article>
            </div>
          </section>
        );
      }

      function ReadingRooms() {
        return (
          <section>
            <div className="section-flag">
              <h2>
                Choose your <span className="red">briefing room</span>
              </h2>
            </div>
            <div className="reading-grid">
              {readingRooms.map((room) => (
                <article className="reading-room" key={room.title}>
                  <div className="eyebrow">{room.eyebrow}</div>
                  <h3>{room.title}</h3>
                  <p>{room.description}</p>
                  <a href={room.href}>{room.cta}</a>
                </article>
              ))}
            </div>
          </section>
        );
      }

      function App() {
        return (
          <>
            <SiteMast current="home" />
            <main className="home-shell">
              <HeroPoster />
              <ExploreGrid />
              <ValueBand />
              <PipelinePoster />
              <CommandRail />
              <ReadingRooms />
            </main>
            <Colophon />
            <TweaksDock />
          </>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
