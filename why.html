    <script type="text/babel">
      function PageIntro() {
        return (
          <section className="page-intro">
            <div className="wrap">
              <div>
                <div className="folio">§ 01 · The case</div>
                <h1>
                  Why <span className="accent">Stilyagi</span>.
                </h1>
              </div>
              <p className="lede">
                Existing prose tools fall into four weak camps. Each solves part
                of the problem by giving up on another. The document below is an
                argument for a fifth camp — one that keeps structural awareness,
                programmability, determinism, and source-fidelity without
                cheating on any of them.
              </p>
            </div>
          </section>
        );
      }

      function FourCamps() {
        const camps = [
          {
            n: "I",
            title: "Vale-like tools",
            body: "Understand structure — but the rule model is constrained by declarative YAML, canned check families, and a deliberately limited extension surface.",
            verdict: "Structural, but capped",
          },
          {
            n: "II",
            title: "Ad-hoc regex",
            body: "Cheap to write. Poor structural awareness, poor fix safety, poor false-positive behaviour once text lives inside headings, tables, docstrings, or mixed markup.",
            verdict: "Dumb in structure",
          },
          {
            n: "III",
            title: "Formatter-adjacent",
            body: "Catch layout and syntax-adjacent issues. Not designed to express editorial policy, terminology rules, or documentation structure constraints.",
            verdict: "Wrong register",
            red: true,
          },
          {
            n: "IV",
            title: "Broad NLP toolkits",
            body: "Flexible — but no source-faithful spans, no repository-friendly CLI, no suppression semantics, no stable lint diagnostics out of the box.",
            verdict: "Too much work",
            red: true,
          },
        ];
        return (
          <section className="stack-section">
            <div className="section-head">
              <div className="num">I-IV</div>
              <div>
                <div className="tag">§ The four weak camps</div>
                <h2>Everything almost works.</h2>
              </div>
            </div>
            <div className="camps">
              {camps.map((c) => (
                <div className="camp" key={c.n}>
                  <div className="numeral">{c.n}</div>
                  <h3>{c.title}</h3>
                  <p className="editorial">{c.body}</p>
                  <span className={`verdict-tag ${c.red ? "red" : ""}`}>
                    {c.verdict}
                  </span>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function StyleHunter() {
        return (
          <section className="style-hunter-panel">
            <div className="inner">
              <img
                src="assets/images/style-hunter.png"
                alt="The Style Hunter — a suited figure with magnifying glass inspects prose"
              />
              <div className="text">
                <h3>
                  The <span className="red">style hunters</span>.
                </h3>
                <p>
                  Rules are written in expressive Python, operating on typed
                  wrappers, not raw JSON dictionaries. Inspired by astroid for
                  node navigability, enabling parent/child traversal and stable
                  properties. Target explicit descriptors like{" "}
                  <code>RegionTarget(kind="heading")</code> rather than relying
                  on abstract string matching.
                </p>
              </div>
            </div>
          </section>
        );
      }

      function TheArgument() {
        return (
          <section className="argument">
            <aside className="margin-note">
              <span className="red">§ 02 · Argument</span>
              The target user isn't struggling with English. They are struggling
              with policy, structure, CI, and the current linting surface —
              which is either too dumb to encode what they want, or too awkward
              to keep doing so.
              <br />
              <br />
              <span className="red">☞ Note.</span> This is an engineering
              problem, not a linguistic one.
            </aside>
            <div className="body">
              <h3>
                The pain isn't "<span className="red">English is hard</span>."
              </h3>
              <p className="editorial">
                The target users of Stilyagi are engineers and technically
                literate writers maintaining documentation inside source
                repositories. Their pain is not that English is hard.
              </p>
              <p className="editorial">
                Their pain is that documentation policy is real, files are
                structured, CI needs determinism, and the current linting
                surface is either too dumb to encode the intended policy, or too
                awkward to continue encoding it.
              </p>

              <h3>
                The value is <span className="red">precise</span>.
              </h3>
              <p className="editorial">
                Against Vale, Stilyagi offers Python-authored rules over a typed
                runtime model instead of YAML plus regex plus fixed rule
                families. Against in-house regex scripts, it provides structural
                parsing, stable spans, fix planning, suppression semantics, and
                cacheable behaviour. Against formatter-adjacent tools, it
                targets prose policy rather than code layout. Against raw spaCy
                or NLTK, it adds the extraction, diagnostics, configuration, and
                CLI contracts that fit normal software engineering workflows.
              </p>

              <h3>
                It is weaker, deliberately, in{" "}
                <span className="red">three</span> places.
              </h3>
              <p className="editorial">
                It will never match a Rust-only rule engine for raw execution
                speed. It deliberately trusts plugin code, and so cannot
                truthfully promise sandboxing. It inherits Python packaging
                complexity for third-party rule packs. These are acceptable
                costs. The product wins or loses on expressiveness,
                debuggability, and adoption — not on shaving the last few
                milliseconds off a single regex rule.
              </p>
            </div>
          </section>
        );
      }

      function Personas() {
        const rows = [
          [
            "Doc &amp; tooling engineers",
            "Deterministic CI, rule packs, SARIF, stable spans, repo-wide policy.",
            "Fancy linguistic research features that slow CI down.",
          ],
          [
            "API &amp; SDK docs teams",
            "Markdown structure, terminology, heading policy, code-adjacent prose, per-file ignores.",
            "Academic NLP purity.",
          ],
          [
            "Python &amp; Rust developers",
            "Docstring summary rules, comment extraction, source-owner metadata, safe fixes.",
            "Deep support for every markup dialect on day one.",
          ],
          [
            "Technically opinionated solo devs",
            "Fast CLI, expressive Python rules, debug visibility, local configuration.",
            "Enterprise plugin governance.",
          ],
          [
            "Agentic &amp; CI environments",
            "JSON output, stdin support, exit-code discipline, predictable cache and suppression behaviour.",
            "Interactive UI affordances.",
          ],
        ];
        return (
          <section className="personas">
            <div className="wrap">
              <div
                className="folio-sm"
                style={{ color: "var(--press-red)", marginBottom: 18 }}
              >
                § 03 · Who for
              </div>
              <h2>
                Five <span className="red">personas</span>, one product surface.
              </h2>
              <p className="intro">
                The same tool must feed the CI pipeline, the doc engineer, the
                polyglot developer, and the agent. Stilyagi defines its
                contracts so a single machine interface satisfies all of them
                without growing a second rule engine.
              </p>
              <table>
                <thead>
                  <tr>
                    <th>Persona</th>
                    <th>Cares about</th>
                    <th>Ignores</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r, i) => (
                    <tr key={i}>
                      <th dangerouslySetInnerHTML={{ __html: r[0] }} />
                      <td dangerouslySetInnerHTML={{ __html: r[1] }} />
                      <td
                        className="ignore"
                        dangerouslySetInnerHTML={{ __html: r[2] }}
                      />
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </section>
        );
      }

      function Values() {
        const items = [
          {
            n: "§ 01",
            h: "Source-faithful",
            p: "Every diagnostic and every applied edit maps back to original bytes. Synthetic spans cannot be written to.",
          },
          {
            n: "§ 02",
            h: "Deterministic",
            p: "Rules sort by pack then code. Files sort by normalised path. The same input yields the same diagnostics, always.",
          },
          {
            n: "§ 03",
            h: "Offline",
            p: "Core functionality never reaches the network. No model auto-downloads. No phone-home. CI works on isolated runners.",
          },
          {
            n: "§ 04",
            h: "Programmable",
            p: "Rules are real Python. Typed wrappers. Capability declarations. No YAML ceiling, no bespoke DSL, no recompile.",
          },
          {
            n: "§ 05",
            h: "Structural",
            p: "Regions, not bytes. Owners, not guesses. Headings, tables, docstrings, and comments — each a first-class extraction target.",
          },
          {
            n: "§ 06",
            h: "Conservative fixes",
            p: "Safe, unsafe, and manual are distinct classes. Safe fixes stay narrow. Overlapping non-identical edits fail loudly.",
          },
          {
            n: "§ 07",
            h: "Honest about trust",
            p: "Plugins are trusted code. The docs say so. The CLI help says so. No claims of sandboxing we cannot keep.",
          },
          {
            n: "§ 08",
            h: "Debuggable",
            p: 'dump-ir is not an afterthought. Maintainers can always ask, "what did the extractor see, and what did the rule receive?"',
          },
        ];
        return (
          <section className="valuesbox">
            <div className="section-head">
              <div className="num">04</div>
              <div>
                <div className="tag">§ Non-negotiables</div>
                <h2>Eight commitments the engine holds.</h2>
              </div>
            </div>
            <div className="valueset">
              {items.map((v) => (
                <div className="card" key={v.n}>
                  <div className="vs-num">{v.n}</div>
                  <h4>{v.h}</h4>
                  <p>{v.p}</p>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function Weaknesses() {
        return (
          <section className="weaknesses">
            <div>
              <div className="folio-sm" style={{ marginBottom: 14 }}>
                § 05 · Rejected alternatives
              </div>
              <h2 style={{ fontSize: "2.4rem", margin: 0, lineHeight: 0.95 }}>
                What we considered, and{" "}
                <span style={{ color: "var(--press-red)" }}>retired</span>.
              </h2>
              <p
                className="editorial"
                style={{ marginTop: 18, fontSize: "1.1rem" }}
              >
                A design document earns its authority by naming the roads it did
                not take. Each of these was considered at length; each was
                rejected for reasons recorded below.
              </p>
              <div
                style={{
                  marginTop: 24,
                  display: "flex",
                  gap: 10,
                  flexWrap: "wrap",
                }}
              >
                <span className="chip">Pure Python</span>
                <span className="chip">Rust-only engine</span>
                <span className="chip">Vale wrapper</span>
                <span className="chip">Raw-AST rules</span>
                <span className="chip">LLM assist</span>
                <span className="chip">No IR</span>
              </div>
            </div>
            <div className="weakness-panel">
              <h3>☞ Five no's</h3>
              <ol>
                <li>
                  <strong>Pure Python parsing.</strong> Makes source-fidelity
                  and future editor performance worse at the exact point where
                  Stilyagi must be strongest.
                </li>
                <li>
                  <strong>Rust-only rule engine.</strong> Cripples the
                  rule-authoring story. The whole point is letting engineers
                  write real rules without a bespoke DSL.
                </li>
                <li>
                  <strong>Vale-compatible wrapper.</strong> The requirement is
                  wholesale replacement. Carrying Vale packaging would preserve
                  the wrong constraints.
                </li>
                <li>
                  <strong>Direct raw-AST rule authoring.</strong> Makes simple
                  structural rules possible, but text-oriented rules would
                  repeatedly flatten markup and rebuild context.
                </li>
                <li>
                  <strong>Heavier LLM-assisted analysis.</strong>{" "}
                  Nondeterministic, expensive, hostile to offline CI. Belongs
                  outside the core.
                </li>
              </ol>
            </div>
          </section>
        );
      }

            <div className="pullquote">
